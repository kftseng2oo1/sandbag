<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="bracket-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#79c0ff"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
    <linearGradient id="bracket-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#56d364"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#58a6ff" flood-opacity="0.25"/>
    </filter>
    <filter id="gold-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f0b429" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#30363d" stroke-width="1" opacity="0.3">
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
  </g>

  <!-- Left bracket < -->
  <g filter="url(#shadow)">
    <polyline points="196,100 96,224 196,348"
      fill="none" stroke="url(#bracket-l)" stroke-width="44"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right bracket > -->
  <g filter="url(#shadow)">
    <polyline points="316,100 416,224 316,348"
      fill="none" stroke="url(#bracket-r)" stroke-width="44"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Gold slash / -->
  <g filter="url(#gold-glow)">
    <line x1="286" y1="112" x2="226" y2="336"
      stroke="#f0b429" stroke-width="38" stroke-linecap="round"/>
  </g>

  <!-- Divider -->
  <line x1="72" y1="374" x2="440" y2="374"
    stroke="#58a6ff" stroke-width="1.5" opacity="0.3"/>

  <!-- HTML label — below divider, clear of brackets -->
  <text x="256" y="458"
    font-family="'Courier New', monospace"
    font-size="82" font-weight="700"
    text-anchor="middle"
    letter-spacing="5"
    fill="#58a6ff" opacity="0.95">HTML</text>

  <!-- Green dot -->
  <circle cx="402" cy="106" r="18" fill="#0d1117"/>
  <circle cx="402" cy="106" r="12" fill="#3fb950"/>

  <!-- Border ring -->
  <rect x="3" y="3" width="506" height="506" rx="110" ry="110"
    fill="none" stroke="#30363d" stroke-width="2" opacity="0.5"/>
</svg>
