<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sandbox">
<meta name="theme-color" content="#161b22">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="apple-icon">
<title>HTML 沙盒</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--accent:#58a6ff;--accent2:#3fb950;--accent3:#f78166;--text:#e6edf3;--text-dim:#8b949e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:7px;white-space:nowrap}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 7px var(--accent2);animation:pulse 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.logo-icon{width:26px;height:26px;border-radius:6px;flex-shrink:0}
.filename-input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 10px;outline:none}
.filename-input:focus{border-color:var(--accent)}
.tabbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-shrink:0}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--text-dim);border-bottom:2px solid transparent;cursor:pointer;user-select:none;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(88,166,255,.05)}
.panels{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;display:none;flex-direction:column}
.panel.active{display:flex}
.editor-meta{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 12px;font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.editor-wrap{flex:1;position:relative;overflow:hidden}
textarea{width:100%;height:100%;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;padding:14px;caret-color:var(--accent);-webkit-overflow-scrolling:touch}
textarea::placeholder{color:var(--text-dim);opacity:.4}
.drop-overlay{position:absolute;inset:0;background:rgba(13,17,23,.88);border:2px dashed var(--accent);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10;backdrop-filter:blur(4px)}
.drop-overlay.active{display:flex}
.drop-icon{font-size:44px}
.drop-text{font-size:15px;font-weight:600;color:var(--accent)}
.preview-meta{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 12px;font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:8px;flex-shrink:0;overflow:hidden}
.preview-status{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-btn{background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--text-dim);font-size:13px;padding:3px 8px;cursor:pointer;flex-shrink:0}
.preview-btn:active{background:var(--surface2)}
.empty-preview{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--text-dim);background:var(--bg)}
.empty-icon{font-size:44px;opacity:.3}
.empty-text{font-size:14px}
iframe{flex:1;border:none;background:#fff;display:none;width:100%}
.actionbar{background:var(--surface);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;flex-shrink:0}
.btn{flex:1;font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:600;padding:11px 8px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .12s}
.btn:active{transform:scale(.96)}
.btn-run{background:var(--accent);color:#000}
.btn-save{background:#238636;color:#fff}
.btn-clear{background:rgba(247,129,102,.15);color:var(--accent3);border:1px solid rgba(247,129,102,.4)}
.dlbar{background:#0d2a15;border-top:1px solid #238636;padding:10px 12px;display:none;align-items:center;gap:10px;flex-shrink:0}
.dlbar.show{display:flex}
.dl-label{font-size:13px;color:var(--accent2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-btn{background:var(--accent2);color:#000;font-weight:700;font-size:13px;padding:8px 18px;border-radius:7px;border:none;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.dl-btn:active{opacity:.8}
.dl-close{background:transparent;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:0 4px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:9px 20px;font-size:13px;color:var(--text);white-space:nowrap;opacity:0;transition:all .2s;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#238636;color:var(--accent2)}
.toast.error{border-color:#da3633;color:var(--accent3)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">
      <img class="logo-icon" id="logoIcon" alt="icon">
      <div class="logo-dot"></div>
      &lt;SANDBOX&gt;
    </div>
    <input class="filename-input" id="filename" value="test.html" placeholder="檔名.html">
  </div>
  <div class="tabbar">
    <div class="tab active" id="tabEditor" onclick="switchTab('editor')">✏️ 編輯器</div>
    <div class="tab" id="tabPreview" onclick="switchTab('preview')">🖥️ 預覽</div>
  </div>
  <div class="panels">
    <div class="panel active" id="panelEditor">
      <div class="editor-meta">
        <span>HTML 原始碼</span>
        <span id="lineCount">0 行 · 0 字元</span>
      </div>
      <div class="editor-wrap" id="editorWrap">
        <textarea id="editor" placeholder="貼上 HTML 原始碼，或把 .html 檔案拖曳進來" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        <div class="drop-overlay" id="dropOverlay"><div class="drop-icon">📄</div><div class="drop-text">放開以載入 HTML 檔案</div></div>
      </div>
    </div>
    <div class="panel" id="panelPreview">
      <div class="preview-meta">
        <span class="preview-status" id="previewStatus">尚未執行</span>
        <button class="preview-btn" onclick="reloadPreview()">↺</button>
        <button class="preview-btn" onclick="clearEditor()" style="color:var(--accent3);border-color:var(--accent3)">✕ 清除</button>
      </div>
      <div class="empty-preview" id="emptyPreview"><div class="empty-icon">🖥️</div><div class="empty-text">按「執行預覽」以查看結果</div></div>
      <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
    </div>
  </div>
  <div class="actionbar">
    <button class="btn btn-clear" onclick="clearEditor()">✕ 清除</button>
    <button class="btn btn-save" onclick="saveFile()">⬇ 儲存</button>
    <button class="btn btn-run" onclick="runPreview()">▶ 執行</button>
  </div>
  <div class="dlbar" id="dlbar">
    <span class="dl-label" id="dlLabel">📄 test.html</span>
    <button class="dl-btn" id="dlBtn" onclick="doDownload()">📋 複製原始碼</button>
    <button class="dl-close" onclick="closeDlBar()">✕</button>
  </div>
</div>
<div class="toast" id="toast"></div>

// ── App ──
var editor = document.getElementById('editor');
var preview = document.getElementById('preview');
var emptyPreview = document.getElementById('emptyPreview');
var lineCount = document.getElementById('lineCount');
var previewStatus = document.getElementById('previewStatus');
var toast = document.getElementById('toast');
var editorWrap = document.getElementById('editorWrap');
var dropOverlay = document.getElementById('dropOverlay');
var filenameInput = document.getElementById('filename');
var lastHtml = '';
var savedName = 'test.html';

function switchTab(tab) {
  document.getElementById('panelEditor').classList.toggle('active', tab==='editor');
  document.getElementById('panelPreview').classList.toggle('active', tab==='preview');
  document.getElementById('tabEditor').classList.toggle('active', tab==='editor');
  document.getElementById('tabPreview').classList.toggle('active', tab==='preview');
}

editor.addEventListener('input', function() {
  var txt = editor.value;
  lineCount.textContent = (txt ? txt.split('\n').length : 0) + ' 行 · ' + txt.length + ' 字元';
});

function runPreview() {
  var html = editor.value.trim();
  if (!html) { showToast('⚠️ 請先貼上 HTML 內容','error'); return; }
  lastHtml = html;
  preview.srcdoc = html;
  emptyPreview.style.display = 'none';
  preview.style.display = 'block';
  previewStatus.textContent = '✓ 預覽已載入';
  showToast('✓ 預覽已更新','success');
  switchTab('preview');
}

function reloadPreview() {
  if (!lastHtml) return;
  preview.srcdoc = '';
  setTimeout(function(){ preview.srcdoc = lastHtml; }, 80);
  showToast('↺ 已重新整理','');
}

function saveFile() {
  var html = editor.value.trim();
  if (!html) { showToast('⚠️ 沒有內容可儲存','error'); return; }
  savedName = filenameInput.value.trim() || 'test.html';
  if (!savedName.match(/\.html?$/i)) savedName += '.html';
  document.getElementById('dlLabel').textContent = '📄 ' + savedName + ' 已備妥';
  document.getElementById('dlbar').classList.add('show');
  showToast('✓ 點「複製原始碼」取得檔案','success');
}

function doDownload() {
  var html = editor.value.trim();
  if (!html) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(html).then(function(){
      document.getElementById('dlBtn').textContent = '✓ 已複製！';
      showToast('✓ 原始碼已複製到剪貼簿','success');
      setTimeout(function(){ document.getElementById('dlBtn').textContent = '📋 複製原始碼'; }, 2500);
    }).catch(function(){ fallbackCopy(html); });
  } else { fallbackCopy(html); }
}

function fallbackCopy(text) {
  editor.focus(); editor.select();
  try {
    document.execCommand('copy');
    document.getElementById('dlBtn').textContent = '✓ 已複製！';
    showToast('✓ 原始碼已複製到剪貼簿','success');
    setTimeout(function(){ document.getElementById('dlBtn').textContent = '📋 複製原始碼'; }, 2500);
    switchTab('editor');
  } catch(e) { showToast('⚠️ 請手動全選編輯器複製','error'); }
}

function closeDlBar() { document.getElementById('dlbar').classList.remove('show'); }

function clearEditor() {
  editor.value = ''; lastHtml = '';
  preview.srcdoc = ''; preview.style.display = 'none';
  emptyPreview.style.display = 'flex';
  previewStatus.textContent = '尚未執行';
  lineCount.textContent = '0 行 · 0 字元';
  document.getElementById('dlbar').classList.remove('show');
  switchTab('editor');
}

editorWrap.addEventListener('dragover', function(e){ e.preventDefault(); dropOverlay.classList.add('active'); });
editorWrap.addEventListener('dragleave', function(e){ if(!editorWrap.contains(e.relatedTarget)) dropOverlay.classList.remove('active'); });
editorWrap.addEventListener('drop', function(e){
  e.preventDefault(); dropOverlay.classList.remove('active');
  var file = e.dataTransfer.files[0];
  if (!file) return;
  if (!file.name.match(/\.html?$/i)) { showToast('⚠️ 請放入 .html 檔案','error'); return; }
  var reader = new FileReader();
  reader.onload = function(ev){ editor.value = ev.target.result; filenameInput.value = file.name; editor.dispatchEvent(new Event('input')); showToast('📄 已載入 '+file.name,'success'); };
  reader.readAsText(file,'utf-8');
});

document.addEventListener('keydown', function(e){
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); runPreview(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); saveFile(); }
});

var toastTimer;
function showToast(msg, type){
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.className = 'toast show' + (type?' '+type:'');
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2500);
}
</script>
